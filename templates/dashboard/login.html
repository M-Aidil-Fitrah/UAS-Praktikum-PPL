{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - AdoptMe</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gray-900 p-8 text-center">
            <h1 class="text-3xl font-extrabold text-orange-500 tracking-tight">AdoptMe<span class="text-white">Admin</span></h1>
            <p class="text-gray-400 mt-2 text-sm">Masuk ke Dashboard Manajemen</p>
        </div>
        <div class="p-8">
            <form method="post" action="{% url 'dashboard_login' %}" class="space-y-6">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-medium">
                    Username atau password salah.
                </div>
                {% endif %}

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" name="username" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-orange-500 focus:ring-orange-500 px-4 py-2" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-orange-500 focus:ring-orange-500 px-4 py-2" required>
                </div>
                <button type="submit" class="w-full bg-orange-500 text-white rounded-lg px-4 py-3 font-bold hover:bg-orange-600 transition shadow-lg hover:shadow-xl">
                    Masuk
                </button>
                <div class="text-center mt-4">
                    <a href="{% url 'home' %}" class="text-sm text-gray-500 hover:text-orange-500">Kembali ke Beranda Publik</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
