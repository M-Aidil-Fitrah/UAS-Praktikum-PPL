{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - AdoptMe</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 py-12">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gray-900 p-8 text-center">
            <h1 class="text-3xl font-extrabold text-orange-500 tracking-tight">AdoptMe<span class="text-white">.</span></h1>
            <p class="text-gray-400 mt-2 text-sm">Bergabung dan Temukan Sahabat Baru</p>
        </div>
        <div class="p-8">
            <form method="post" action="{% url 'user_register' %}" class="space-y-4">
                {% csrf_token %}
                
                {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <p class="mt-1 text-sm text-red-600">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}

                <button type="submit" class="w-full bg-orange-500 text-white rounded-lg px-4 py-3 mt-4 font-bold hover:bg-orange-600 transition shadow-lg hover:shadow-xl">
                    Daftar Sekarang
                </button>
                <div class="text-center mt-4 pt-4 border-t border-gray-100">
                    <p class="text-sm text-gray-500">Sudah punya akun? <a href="{% url 'user_login' %}" class="text-orange-500 hover:underline font-medium">Masuk di sini</a></p>
                    <a href="{% url 'home' %}" class="text-sm text-gray-400 hover:text-orange-500 block mt-3">Kembali ke Beranda Publik</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
