{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - AdoptMe</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gray-900 p-8 text-center">
            <h1 class="text-3xl font-extrabold text-orange-500 tracking-tight">AdoptMe<span class="text-white">.</span></h1>
            <p class="text-gray-400 mt-2 text-sm">Masuk ke Akun Anda</p>
        </div>
        <div class="p-8">
            <form method="post" action="{% url 'user_login' %}" class="space-y-6">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-medium">
                    Username atau password salah.
                </div>
                {% endif %}

                <div class="relative">
                    <input type="text" id="username" name="username" class="block px-4 pb-2.5 pt-5 w-full text-sm text-gray-900 bg-gray-50 rounded-xl border border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-orange-500 peer" placeholder=" " required>
                    <label for="username" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-orange-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4">Username</label>
                </div>
                <div class="relative">
                    <input type="password" id="password" name="password" class="block px-4 pb-2.5 pt-5 w-full text-sm text-gray-900 bg-gray-50 rounded-xl border border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-orange-500 peer" placeholder=" " required>
                    <label for="password" class="absolute text-sm text-gray-500 duration-300 transform -translate-y-4 scale-75 top-4 z-10 origin-[0] left-4 peer-focus:text-orange-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-4">Password</label>
                </div>
                <button type="submit" class="w-full bg-orange-500 text-white rounded-xl px-4 py-3 font-bold hover:bg-orange-600 transition duration-300 shadow-md hover:shadow-lg hover:-translate-y-0.5">
                    Masuk
                </button>
                <div class="text-center mt-4">
                    <p class="text-sm text-gray-500">Belum punya akun? <a href="{% url 'user_register' %}" class="text-orange-500 hover:underline font-medium">Daftar sekarang</a></p>
                    <a href="{% url 'home' %}" class="text-sm text-gray-400 hover:text-orange-500 block mt-3">Kembali ke Beranda Publik</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
