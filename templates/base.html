{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AdoptMe - Temukan Teman Baru{% endblock %}</title>
    <!-- Tailwind CSS (compiled via package.json script) -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="{% url 'home' %}" class="flex items-center gap-2">
                    <span class="text-2xl font-extrabold text-orange-500 tracking-tight">AdoptMe<span class="text-gray-900">.</span></span>
                </a>
                <div class="flex items-center gap-4">
                    <a href="{% url 'home' %}" class="text-gray-600 hover:text-orange-500 font-medium transition">Beranda</a>
                    <a href="/admin" target="_blank" class="bg-gray-900 text-white px-5 py-2 rounded-full font-medium hover:bg-orange-500 transition shadow-md">Login Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm font-medium">© 2026 AdoptMe. Proyek UAS Lab PPL.</p>
        </div>
    </footer>

</body>
</html>
